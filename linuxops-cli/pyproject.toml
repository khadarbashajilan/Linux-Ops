[project]
name = "linuxops-cli"
version = "0.1.0"
description = "CLI client for LinuxOps AI assistant"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "toml>=0.10.2",
]

[project.scripts]
linuxops = "linuxops.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["linuxops*"]
